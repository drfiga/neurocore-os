<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b0a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NeuroCore"><title>NeuroCore</title><style>
:root{--bg:#070b0a;--p:#0e1714;--p2:#14201c;--ln:#263832;--tx:#f6f7f6;--mu:#aab7b2;--ac:#c7a85c;--ok:#3a9a74}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;padding:14px 14px 90px}.top{position:sticky;top:0;z-index:4;background:rgba(7,11,10,.96);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}.brand{font-weight:800;letter-spacing:.09em;color:var(--ac)}.sub{font-size:12px;color:var(--mu)}button,input,select,textarea{font:inherit;font-size:16px}button{min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);padding:10px 12px}.pri{background:var(--ac);border-color:var(--ac);color:#151108;font-weight:800}.ok{background:#125642;border-color:#1b7458}.grid{display:grid;gap:10px}.metrics{grid-template-columns:repeat(2,1fr);margin:10px 0}.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px}.metric b{display:block;font-size:28px;margin-top:6px}.muted,.metric span{color:var(--mu);font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.list{display:grid;gap:10px}.case{display:grid;gap:6px}.case .row{display:flex;justify-content:space-between;gap:8px;align-items:start}.badge{font-size:11px;border:1px solid var(--ln);padding:5px 7px;border-radius:999px;color:var(--mu)}h2{font-size:20px;margin:14px 0 10px}h3{margin:0;font-size:17px}.form{display:grid;gap:12px}.field label{display:block;color:var(--mu);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;background:#08100e;color:var(--tx);border:1px solid #2b3c36;border-radius:10px}.field textarea{min-height:82px}.tabs{position:fixed;left:0;right:0;bottom:0;background:#09100e;border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:6}.tabs button{border:0;background:transparent;color:var(--mu);font-size:11px;padding:8px 2px}.tabs button.on{color:var(--ac)}.hidden{display:none!important}.docs{display:grid;gap:8px}.docs button{text-align:left}.checks{display:grid;gap:8px}.check{display:flex;gap:10px;align-items:flex-start}.check input{margin-top:5px}.timeline{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.step{white-space:nowrap;border:1px solid var(--ln);border-radius:999px;padding:7px 9px;font-size:11px;color:var(--mu)}.step.on{color:#151108;background:var(--ac);border-color:var(--ac)}.step.done{color:#bfe1d3;border-color:#29654e}.notice{font-size:12px;color:#e8d8a8;background:#2c2615;border:1px solid #665321;border-radius:12px;padding:10px}.modal{position:fixed;inset:0;z-index:20;background:#fff;color:#111;overflow:auto;padding:20px}.modal .paper{max-width:760px;margin:auto;font-family:Georgia,serif;line-height:1.5}.modal .bar{position:sticky;top:0;background:#fff;display:flex;gap:8px;justify-content:flex-end;padding-bottom:12px}.modal button{color:#111;background:#eee}.modal .pri{background:#111;color:#fff}.paper h1{font-size:22px}.paper h2{font-size:16px;border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:20px}@media(min-width:650px){.metrics{grid-template-columns:repeat(4,1fr)}.form.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}@media print{body>*:not(#modal){display:none}.modal{position:static}.bar{display:none!important}}
</style></head><body><div id="app" class="app"><div class="top"><div><div class="brand">NEUROCORE+</div><div class="sub">Circuito quirúrgico</div></div><button id="plus" class="pri">+ Indicar</button></div><main id="view"></main></div><div class="tabs" id="tabs"><button data-v="home" class="on">Inicio</button><button data-v="new">Indicar</button><button data-v="cases">Casos</button><button data-v="tasks">Pendientes</button><button data-v="finance">Finanzas</button></div><div id="modal" class="hidden"></div><script>
"use strict";
const P={"Microdiscectomía lumbar":{r:"Lumbar",q:["RM/TC pertinente","Laboratorio preoperatorio","Consentimiento informado","Nivel y lateralidad confirmados"],po:["Fuerza y sensibilidad MMII","Dolor","Herida","Movilidad","Esfínteres si corresponde"]},"Laminectomía lumbar":{r:"Lumbar",q:["RM/TC","Laboratorio","Consentimiento","Niveles confirmados"],po:["Fuerza","Sensibilidad","Dolor","Marcha","Herida","Drenaje si existe"]},"Artrodesis lumbar instrumentada":{r:"Lumbar",q:["RM/TC","Laboratorio","Consentimiento","Autorización de implantes","Niveles confirmados"],po:["Fuerza","Sensibilidad","Dolor","Drenaje","Movilidad","Imágenes según indicación"]},"Discectomía cervical anterior + artrodesis":{r:"Cervical",q:["RM/TC cervical","Laboratorio","Consentimiento","Niveles confirmados","Implantes autorizados"],po:["Fuerza 4 miembros","Sensibilidad","Deglución","Voz","Vía aérea","Herida cervical"]},"Descompresión cervical posterior":{r:"Cervical",q:["RM/TC","Laboratorio","Consentimiento","Niveles confirmados"],po:["Fuerza 4 miembros","Sensibilidad","Dolor","Herida","Marcha"]},"Artrodesis cervical posterior":{r:"Cervical",q:["RM/TC","Laboratorio","Consentimiento","Implantes autorizados","Niveles confirmados"],po:["Fuerza 4 miembros","Sensibilidad","Dolor","Herida","Imágenes según indicación"]},"Craneotomía para tumor cerebral":{r:"Cráneo",q:["RM cerebral","Laboratorio","Consentimiento","UTI según riesgo","Plan de anatomía patológica"],po:["Conciencia","Pupilas","Déficit focal","Crisis","Herida","TA","Imágenes según indicación"]},"Tumor espinal":{r:"Columna",q:["RM","Laboratorio","Consentimiento","Nivel confirmado"],po:["Fuerza","Sensibilidad","Esfínteres","Dolor","Herida"]},"Drenaje ventricular externo":{r:"Cráneo",q:["Neuroimagen","Laboratorio/coagulación","Consentimiento cuando sea posible","UTI"],po:["Pupilas","Respuesta al dolor","Gesticulación/movimiento","Sedación","TA","DVE abierto/cerrado según orden","Altura del sistema","Débito","Características LCR","PIC si corresponde","Laboratorio","Diuresis","TC según indicación"]},"Derivación ventriculoperitoneal":{r:"Cráneo",q:["Neuroimagen","Laboratorio","Consentimiento"],po:["Conciencia","Pupilas","Neurológico","Herida craneal","Herida abdominal"]},"Hematoma intracraneano":{r:"Cráneo",q:["TC","Laboratorio/coagulación","Consentimiento cuando sea posible","UTI"],po:["Conciencia","Pupilas","Déficit focal","TA","Drenajes","TC según indicación"]},"Hematoma subdural":{r:"Cráneo",q:["TC","Laboratorio/coagulación","Anticoagulación revisada","Consentimiento"],po:["Conciencia","Pupilas","Déficit","Drenaje","TC","Movilización"]},"Cirugía de fosa posterior":{r:"Cráneo",q:["RM/TC","Laboratorio","Consentimiento","UTI según riesgo"],po:["Conciencia","Pupilas","Pares craneales","Fuerza","Coordinación","Herida","Hidrocefalia"]},"Bloqueo epidural / foraminal":{r:"Columna",q:["Estudios pertinentes","Nivel/lado confirmados","Consentimiento"],po:["Dolor","Fuerza","Sensibilidad","Eventos adversos inmediatos"]},"Nervio periférico":{r:"Nervio periférico",q:["Evaluación clínica","Neurofisiología si corresponde","Sitio/lado confirmados","Consentimiento"],po:["Fuerza","Sensibilidad","Dolor","Herida"]}};
const ST=["Indicada","Autorización en trámite","Autorizada","Programada","PreQ completo","Internado","Operado","Postoperatorio","Alta prevista","Alta otorgada","Control","Cierre clínico"],FS=["Sin presentar","Presentado","Facturado","Pendiente de cobro","Cobrado","Observado/Rechazado"];
const S=()=>JSON.parse(localStorage.getItem("nc_cases")||"[]"),W=a=>localStorage.setItem("nc_cases",JSON.stringify(a)),E=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c])),ID=p=>p+Date.now().toString(36).toUpperCase(),D=x=>x?new Date(x+"T12:00:00").toLocaleDateString("es-AR"):"—",M=x=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(x)||0);
let V="home",CID=null;const view=document.getElementById("view"),modal=document.getElementById("modal");
function nav(v,id=null){V=v;CID=id;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));render()}
function metric(t,n){return `<div class="card metric"><span>${t}</span><b>${n}</b></div>`}
function tasks(c){let a=[];(P[c.proc]?.q||[]).forEach((x,i)=>a.push({k:"q"+i,t:x}));if(["Indicada","Autorización en trámite"].includes(c.status))a.unshift({k:"auth",t:"Solicitar / verificar autorización"});if(["Operado","Postoperatorio"].includes(c.status))a.push({k:"post",t:"Completar evolución postoperatoria"});if(c.status==="Alta prevista")a.push({k:"alta",t:"Completar documentación de alta"});return a}
function home(){const a=S(),today=new Date().toISOString().slice(0,10);return `<div class="notice">Datos guardados localmente en este iPhone. Antes de uso clínico definitivo: autenticación, cifrado, backup y control de acceso.</div><div class="actions"><button class="pri" data-go="new">+ Indicación</button><button data-go="cases">Ver casos</button></div><div class="grid metrics">${metric("Cirugías hoy",a.filter(c=>c.date===today).length)}${metric("Internados",a.filter(c=>["Internado","Operado","Postoperatorio","Alta prevista"].includes(c.status)).length)}${metric("Pendientes",a.reduce((n,c)=>n+tasks(c).filter(t=>!c.done?.[t.k]).length,0))}${metric("Sin cobrar",a.filter(c=>c.fin!=="Cobrado").length)}</div><h2>Casos activos</h2>${list(a.filter(c=>c.status!=="Cierre clínico").slice(0,8))}`}
function list(a){return a.length?`<div class="list">${a.map(c=>`<div class="card case" data-open="${c.id}"><div class="row"><h3>${E(c.name)}</h3><span class="badge">${E(c.status)}</span></div><div>${E(c.proc)} ${E(c.level||"")}</div><div class="muted">${E(c.dx)} · ${D(c.date)}</div></div>`).join("")}</div>`:`<div class="card muted">Sin casos cargados.</div>`}
function form(){return `<h2>Nueva indicación</h2><form id="f" class="form two"><div class="field"><label>Paciente</label><input name="name" required></div><div class="field"><label>DNI</label><input name="dni" required></div><div class="field"><label>Obra social</label><input name="ins"></div><div class="field"><label>N.º afiliado</label><input name="aff"></div><div class="field span2"><label>Diagnóstico</label><input name="dx" required></div><div class="field span2"><label>Resumen clínico</label><textarea name="summary"></textarea></div><div class="field"><label>Procedimiento</label><select name="proc" id="proc" required><option value="">Seleccionar…</option>${Object.keys(P).map(x=>`<option>${E(x)}</option>`).join("")}</select></div><div class="field"><label>Región</label><input name="region" id="region"></div><div class="field"><label>Nivel/es</label><input name="level"></div><div class="field"><label>Lateralidad</label><select name="side"><option>No aplica</option><option>Derecha</option><option>Izquierda</option><option>Bilateral</option></select></div><div class="field"><label>Institución</label><input name="inst"></div><div class="field"><label>Fecha</label><input type="date" name="date"></div><div class="field"><label>Urgencia</label><select name="urg"><option>Electiva</option><option>Preferente</option><option>Urgente</option><option>Emergencia</option></select></div><div class="field"><label>Módulo</label><input name="module"></div><div class="field"><label>Unidades</label><input type="number" name="units"></div><div class="field"><label>Valor unidad</label><input type="number" name="uv"></div><div class="field"><label>Honorarios</label><input type="number" name="fees"></div><button class="pri span2">CREAR CIRUGÍA</button></form>`}
function cases(){return `<h2>Casos quirúrgicos</h2>${list(S())}`}
function taskview(){let r=[];S().forEach(c=>tasks(c).filter(t=>!c.done?.[t.k]).forEach(t=>r.push([c,t])));return `<h2>Pendientes</h2>${r.length?`<div class="card checks">${r.map(([c,t])=>`<label class="check"><input type="checkbox" data-task="${c.id}|${t.k}"><span><b>${E(t.t)}</b><div class="muted">${E(c.name)} · ${E(c.proc)}</div></span></label>`).join("")}</div>`:`<div class="card muted">Sin pendientes.</div>`}`}
function finance(){const a=S(),tot=a.reduce((s,c)=>s+(+c.fees||0),0),cob=a.filter(c=>c.fin==="Cobrado").reduce((s,c)=>s+(+c.fees||0),0);return `<h2>Finanzas</h2><div class="grid metrics">${metric("Registrado",M(tot))}${metric("Cobrado",M(cob))}${metric("Pendiente",M(tot-cob))}</div>${list(a)}`}
function casedetail(){const c=S().find(x=>x.id===CID);if(!c)return `<div class="card">Caso no encontrado.</div>`;const i=ST.indexOf(c.status),po=P[c.proc]?.po||[],ts=tasks(c);return `<button data-go="cases">← Casos</button><h2>${E(c.name)}</h2><div class="card"><div class="row"><div><b>${E(c.proc)} ${E(c.level||"")}</b><div class="muted">${E(c.dx)}</div></div><span class="badge">${E(c.status)}</span></div><div class="timeline">${ST.map((s,j)=>`<span class="step ${j<i?"done":j===i?"on":""}">${E(s)}</span>`).join("")}</div><div class="field"><label>Estado</label><select id="st">${ST.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></div><button id="savest" class="ok">Guardar estado</button></div><h2>Documentos</h2><div class="docs">${[["hc","Resumen de historia clínica"],["ind","Indicación quirúrgica"],["auth","Solicitud de autorización"],["pre","Checklist prequirúrgico"],["foja","Foja quirúrgica base"],["d0","Evolución D0"],["d1","Evolución D1"],["alta","Epicrisis / alta"],["hon","Honorarios"]].map(d=>`<button data-doc="${d[0]}">${d[1]}</button>`).join("")}</div><h2>Checklist</h2><div class="card checks">${ts.map(t=>`<label class="check"><input type="checkbox" data-task="${c.id}|${t.k}" ${c.done?.[t.k]?"checked":""}><span>${E(t.t)}</span></label>`).join("")||"Sin tareas activas."}</div><h2>Postoperatorio específico</h2><div class="card"><ul>${po.map(x=>`<li>${E(x)}</li>`).join("")}</ul></div><h2>Finanzas</h2><div class="card form"><div class="field"><label>Estado</label><select id="fin">${FS.map(s=>`<option ${s===c.fin?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>Honorarios</label><input id="fee" type="number" value="${E(c.fees||"")}"></div><button id="savefin">Guardar finanzas</button></div>`}
function doc(c,k){const sec=(t,b)=>`<h2>${t}</h2>${b}`,base=`<small>NeuroCore+ · ${E(c.ep)}</small><h1>${E(c.name)}</h1><p><b>DNI:</b> ${E(c.dni||"—")} · <b>Cobertura:</b> ${E(c.ins||"—")} · <b>Afiliado:</b> ${E(c.aff||"—")}</p><p><b>Diagnóstico:</b> ${E(c.dx)}</p><p><b>Procedimiento:</b> ${E(c.proc)} ${E(c.level||"")} ${E(c.side||"")}</p>`;if(k==="hc")return base+sec("Resumen clínico",`<p>${E(c.summary||"Sin resumen cargado.")}</p>`)+sec("Conducta",`<p>Se indica ${E(c.proc)} ${E(c.level||"")} ${E(c.side||"")}.</p>`);if(k==="ind")return base+sec("Indicación quirúrgica",`<p>Se indica ${E(c.proc)} por ${E(c.dx)}. Prioridad: ${E(c.urg)}.</p>`);if(k==="auth")return base+sec("Solicitud",`<p>Se solicita autorización para ${E(c.proc)} ${E(c.level||"")}.</p><p>Módulo: ${E(c.module||"—")} · Unidades: ${E(c.units||"—")}</p>`);if(k==="pre")return base+sec("Checklist prequirúrgico",`<ul>${(P[c.proc]?.q||[]).map(x=>`<li>☐ ${E(x)}</li>`).join("")}</ul>`);if(k==="foja")return base+sec("Foja quirúrgica base",`<p>Institución: ${E(c.inst||"—")} · Fecha: ${D(c.date)}</p><p>Completar con técnica efectivamente realizada, hallazgos, implantes, hemostasia, cierre, complicaciones y destino postoperatorio.</p>`);if(k==="d0"||k==="d1")return base+sec(`Evolución ${k.toUpperCase()}`,`<p>Estado clínico: _______________________________________</p><p>Neurológico: __________________________________________</p><ul>${(P[c.proc]?.po||[]).map(x=>`<li>☐ ${E(x)}</li>`).join("")}</ul><p>Conducta: _____________________________________________</p>`);if(k==="alta")return base+sec("Epicrisis / alta",`<p>Resumen de internación: __________________________________________</p><p>Medicación: __________________________</p><p>Cuidados / actividad: __________________</p><p>Signos de alarma: _____________________</p><p>Control: ______________________________</p>`);return base+sec("Honorarios",`<p>Módulo: ${E(c.module||"—")} · Unidades: ${E(c.units||"—")} · Valor unidad: ${M(c.uv)} · Honorarios: ${M(c.fees)} · Estado: ${E(c.fin)}</p>`)}
function showdoc(k){const c=S().find(x=>x.id===CID);modal.className="modal";modal.innerHTML=`<div class="bar"><button id="close">Cerrar</button><button id="print" class="pri">Imprimir / PDF</button></div><div class="paper">${doc(c,k)}</div>`;document.getElementById("close").onclick=()=>{modal.className="hidden";modal.innerHTML=""};document.getElementById("print").onclick=()=>window.print()}
function render(){view.innerHTML=V==="home"?home():V==="new"?form():V==="cases"?cases():V==="tasks"?taskview():V==="finance"?finance():casedetail();bind()}
function bind(){view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));view.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>nav("case",b.dataset.open));view.querySelectorAll("[data-task]").forEach(x=>x.onchange=()=>{let[id,k]=x.dataset.task.split("|"),a=S(),c=a.find(z=>z.id===id);c.done=c.done||{};c.done[k]=x.checked;W(a);render()});view.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>showdoc(b.dataset.doc));if(V==="new"){proc.onchange=()=>region.value=P[proc.value]?.r||"";f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f).entries());if(!o.fees&&o.units&&o.uv)o.fees=+o.units*+o.uv;const c={...o,id:ID("C"),ep:ID("E"),status:"Indicada",fin:"Sin presentar",done:{},created:new Date().toISOString()};const a=S();a.unshift(c);W(a);nav("case",c.id)}}if(V==="case"){const a=S(),c=a.find(x=>x.id===CID);savest.onclick=()=>{c.status=st.value;W(a);render()};savefin.onclick=()=>{c.fin=fin.value;c.fees=fee.value;W(a);render()}}}
document.getElementById("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>nav(b.dataset.v));document.getElementById("plus").onclick=()=>nav("new");render();
</script></body></html>
