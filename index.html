<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NeuroCore">
<title>NeuroCore</title>
<style>
:root{--bg:#070b0a;--p:#0e1714;--p2:#14201c;--ln:#263832;--tx:#f6f7f6;--mu:#aab7b2;--ac:#c7a85c;--ok:#3a9a74;--warn:#c89a45;--danger:#b55252}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
.app{max-width:760px;margin:auto;padding:14px 14px 96px}
.top{position:sticky;top:0;z-index:4;background:rgba(7,11,10,.96);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px}
.brand{font-weight:800;letter-spacing:.09em;color:var(--ac)}
.sub{font-size:12px;color:var(--mu)}
button,input,select,textarea{font:inherit;font-size:16px}
button{min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);padding:10px 12px;touch-action:manipulation}
.pri{background:var(--ac);border-color:var(--ac);color:#151108;font-weight:800}
.ok{background:#125642;border-color:#1b7458}
.danger{background:#351919;border-color:#6b3030;color:#ffd6d6}
.grid{display:grid;gap:10px}
.metrics{grid-template-columns:repeat(2,1fr);margin:10px 0}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px}
.metric b{display:block;font-size:28px;margin-top:6px}
.muted,.metric span{color:var(--mu);font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.list{display:grid;gap:10px}
.case{display:grid;gap:6px}
.case .row{display:flex;justify-content:space-between;gap:8px;align-items:start}
.badge{font-size:11px;border:1px solid var(--ln);padding:5px 7px;border-radius:999px;color:var(--mu)}
.badge.warn{border-color:#735c27;color:#f3d78e;background:#2d2614}
.badge.ok{border-color:#29654e;color:#bfe1d3;background:#102a20}
h2{font-size:20px;margin:14px 0 10px}
h3{margin:0;font-size:17px}
.form{display:grid;gap:12px}
.field label{display:block;color:var(--mu);font-size:12px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px;background:#08100e;color:var(--tx);border:1px solid #2b3c36;border-radius:10px}
.field textarea{min-height:82px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#09100e;border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:6}
.tabs button{border:0;background:transparent;color:var(--mu);font-size:11px;padding:8px 2px}
.tabs button.on{color:var(--ac)}
.hidden{display:none!important}
.docs{display:grid;gap:8px}
.docs button{text-align:left}
.checks{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:5px}
.timeline{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}
.step{white-space:nowrap;border:1px solid var(--ln);border-radius:999px;padding:7px 9px;font-size:11px;color:var(--mu)}
.step.on{color:#151108;background:var(--ac);border-color:var(--ac)}
.step.done{color:#bfe1d3;border-color:#29654e}
.notice{font-size:12px;color:#e8d8a8;background:#2c2615;border:1px solid #665321;border-radius:12px;padding:10px}
.notice.ok{color:#cde8dc;background:#102a20;border-color:#29654e}
.backup-status{display:flex;align-items:center;justify-content:space-between;gap:10px}
.backup-status strong{display:block;margin-bottom:3px}
.bigbtn{width:100%;min-height:54px;font-weight:700}
.sep{border:0;border-top:1px solid var(--ln);margin:14px 0}
.modal{position:fixed;inset:0;z-index:20;background:#fff;color:#111;overflow:auto;padding:20px}
.modal .paper{max-width:760px;margin:auto;font-family:Georgia,serif;line-height:1.5}
.modal .bar{position:sticky;top:0;background:#fff;display:flex;gap:8px;justify-content:flex-end;padding-bottom:12px}
.modal button{color:#111;background:#eee}
.modal .pri{background:#111;color:#fff}
.paper h1{font-size:22px}
.paper h2{font-size:16px;border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:20px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:650px){.metrics{grid-template-columns:repeat(4,1fr)}.form.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
@media print{body>*:not(#modal){display:none}.modal{position:static}.bar{display:none!important}}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="top">
    <div><div class="brand">NEUROCORE+</div><div class="sub">Circuito quirúrgico · v2.2</div></div>
    <button id="plus" class="pri">+ Indicar</button>
  </div>
  <main id="view"></main>
</div>
<div class="tabs" id="tabs">
  <button data-v="home" class="on">Inicio</button>
  <button data-v="new">Indicar</button>
  <button data-v="cases">Casos</button>
  <button data-v="backup">iCloud</button>
  <button data-v="finance">Finanzas</button>
</div>
<div id="modal" class="hidden"></div>
<input id="restoreFile" class="hidden" type="file" accept=".ncbk,.json,application/json">

<script>
"use strict";

const P={
"Microdiscectomía lumbar":{r:"Lumbar",q:["RM/TC pertinente","Laboratorio preoperatorio","Consentimiento informado","Nivel y lateralidad confirmados"],po:["Fuerza y sensibilidad MMII","Dolor","Herida","Movilidad","Esfínteres si corresponde"]},
"Laminectomía lumbar":{r:"Lumbar",q:["RM/TC","Laboratorio","Consentimiento","Niveles confirmados"],po:["Fuerza","Sensibilidad","Dolor","Marcha","Herida","Drenaje si existe"]},
"Artrodesis lumbar instrumentada":{r:"Lumbar",q:["RM/TC","Laboratorio","Consentimiento","Autorización de implantes","Niveles confirmados"],po:["Fuerza","Sensibilidad","Dolor","Drenaje","Movilidad","Imágenes según indicación"]},
"Discectomía cervical anterior + artrodesis":{r:"Cervical",q:["RM/TC cervical","Laboratorio","Consentimiento","Niveles confirmados","Implantes autorizados"],po:["Fuerza 4 miembros","Sensibilidad","Deglución","Voz","Vía aérea","Herida cervical"]},
"Descompresión cervical posterior":{r:"Cervical",q:["RM/TC","Laboratorio","Consentimiento","Niveles confirmados"],po:["Fuerza 4 miembros","Sensibilidad","Dolor","Herida","Marcha"]},
"Artrodesis cervical posterior":{r:"Cervical",q:["RM/TC","Laboratorio","Consentimiento","Implantes autorizados","Niveles confirmados"],po:["Fuerza 4 miembros","Sensibilidad","Dolor","Herida","Imágenes según indicación"]},
"Craneotomía para tumor cerebral":{r:"Cráneo",q:["RM cerebral","Laboratorio","Consentimiento","UTI según riesgo","Plan de anatomía patológica"],po:["Conciencia","Pupilas","Déficit focal","Crisis","Herida","TA","Imágenes según indicación"]},
"Tumor espinal":{r:"Columna",q:["RM","Laboratorio","Consentimiento","Nivel confirmado"],po:["Fuerza","Sensibilidad","Esfínteres","Dolor","Herida"]},
"Drenaje ventricular externo":{r:"Cráneo",q:["Neuroimagen","Laboratorio/coagulación","Consentimiento cuando sea posible","UTI"],po:["Pupilas","Respuesta al dolor","Gesticulación/movimiento","Sedación","TA","DVE abierto/cerrado según orden","Altura del sistema","Débito","Características LCR","PIC si corresponde","Laboratorio","Diuresis","TC según indicación"]},
"Derivación ventriculoperitoneal":{r:"Cráneo",q:["Neuroimagen","Laboratorio","Consentimiento"],po:["Conciencia","Pupilas","Neurológico","Herida craneal","Herida abdominal"]},
"Hematoma intracraneano":{r:"Cráneo",q:["TC","Laboratorio/coagulación","Consentimiento cuando sea posible","UTI"],po:["Conciencia","Pupilas","Déficit focal","TA","Drenajes","TC según indicación"]},
"Hematoma subdural":{r:"Cráneo",q:["TC","Laboratorio/coagulación","Anticoagulación revisada","Consentimiento"],po:["Conciencia","Pupilas","Déficit","Drenaje","TC","Movilización"]},
"Cirugía de fosa posterior":{r:"Cráneo",q:["RM/TC","Laboratorio","Consentimiento","UTI según riesgo"],po:["Conciencia","Pupilas","Pares craneales","Fuerza","Coordinación","Herida","Hidrocefalia"]},
"Bloqueo epidural / foraminal":{r:"Columna",q:["Estudios pertinentes","Nivel/lado confirmados","Consentimiento"],po:["Dolor","Fuerza","Sensibilidad","Eventos adversos inmediatos"]},
"Nervio periférico":{r:"Nervio periférico",q:["Evaluación clínica","Neurofisiología si corresponde","Sitio/lado confirmados","Consentimiento"],po:["Fuerza","Sensibilidad","Dolor","Herida"]}
};

const ST=["Indicada","Autorización en trámite","Autorizada","Programada","PreQ completo","Internado","Operado","Postoperatorio","Alta prevista","Alta otorgada","Control","Cierre clínico"];
const FS=["Sin presentar","Presentado","Facturado","Pendiente de cobro","Cobrado","Observado/Rechazado"];

const S=()=>JSON.parse(localStorage.getItem("nc_cases")||"[]");
const W=a=>{localStorage.setItem("nc_cases",JSON.stringify(a));markDirty()};
const E=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ID=p=>p+Date.now().toString(36).toUpperCase();
const D=x=>x?new Date(x+"T12:00:00").toLocaleDateString("es-AR"):"—";
const M=x=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(x)||0);

function markDirty(){localStorage.setItem("nc_dirty","1");localStorage.setItem("nc_last_change",new Date().toISOString())}
function dirty(){return localStorage.getItem("nc_dirty")==="1"}
function hasBackup(){return !!localStorage.getItem("nc_last_backup")}
function lastBackup(){return localStorage.getItem("nc_last_backup")||""}
function setBackedUp(){localStorage.setItem("nc_dirty","0");localStorage.setItem("nc_last_backup",new Date().toISOString())}
function fmtDateTime(x){return x?new Date(x).toLocaleString("es-AR"):"Nunca"}

let V="home",CID=null;
const view=document.getElementById("view"),modal=document.getElementById("modal"),restoreFile=document.getElementById("restoreFile");

function nav(v,id=null){
  V=v;CID=id;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  render();
}
function metric(t,n){return `<div class="card metric"><span>${t}</span><b>${n}</b></div>`}
function tasks(c){
  let a=[];
  (P[c.proc]?.q||[]).forEach((x,i)=>a.push({k:"q"+i,t:x}));
  if(["Indicada","Autorización en trámite"].includes(c.status))a.unshift({k:"auth",t:"Solicitar / verificar autorización"});
  if(["Operado","Postoperatorio"].includes(c.status))a.push({k:"post",t:"Completar evolución postoperatoria"});
  if(c.status==="Alta prevista")a.push({k:"alta",t:"Completar documentación de alta"});
  return a
}
function home(){
  const a=S(),today=new Date().toISOString().slice(0,10),needs=dirty(),hb=hasBackup();
  const backupText=!hb?"Todavía no hiciste el primer backup en iCloud.":(needs?"Hay cambios sin respaldar en iCloud.":"Backup de iCloud al día.");
  return `
  <div class="notice ${hb&&!needs?"ok":""}">${backupText}</div>
  <div class="actions">
    <button class="pri" data-go="new">+ Indicación</button>
    <button data-go="backup">${needs?"Guardar en iCloud":"iCloud"}</button>
  </div>
  <div class="grid metrics">
    ${metric("Cirugías hoy",a.filter(c=>c.date===today).length)}
    ${metric("Internados",a.filter(c=>["Internado","Operado","Postoperatorio","Alta prevista"].includes(c.status)).length)}
    ${metric("Pendientes",a.reduce((n,c)=>n+tasks(c).filter(t=>!c.done?.[t.k]).length,0))}
    ${metric("Sin cobrar",a.filter(c=>c.fin!=="Cobrado").length)}
  </div>
  <h2>Casos activos</h2>${list(a.filter(c=>c.status!=="Cierre clínico").slice(0,8))}`;
}
function list(a){
  return a.length?`<div class="list">${a.map(c=>`
    <div class="card case" data-open="${c.id}">
      <div class="row"><h3>${E(c.name)}</h3><span class="badge">${E(c.status)}</span></div>
      <div>${E(c.proc)} ${E(c.level||"")}</div>
      <div class="muted">${E(c.dx)} · ${D(c.date)}</div>
    </div>`).join("")}</div>`:`<div class="card muted">Sin casos cargados.</div>`;
}
function form(){
  return `<h2>Nueva indicación</h2><form id="f" class="form two">
  <div class="field"><label>Paciente</label><input name="name" required></div>
  <div class="field"><label>DNI</label><input name="dni" required></div>
  <div class="field"><label>Obra social</label><input name="ins"></div>
  <div class="field"><label>N.º afiliado</label><input name="aff"></div>
  <div class="field span2"><label>Diagnóstico</label><input name="dx" required></div>
  <div class="field span2"><label>Resumen clínico</label><textarea name="summary"></textarea></div>
  <div class="field"><label>Procedimiento</label><select name="proc" id="proc" required><option value="">Seleccionar…</option>${Object.keys(P).map(x=>`<option>${E(x)}</option>`).join("")}</select></div>
  <div class="field"><label>Región</label><input name="region" id="region"></div>
  <div class="field"><label>Nivel/es</label><input name="level"></div>
  <div class="field"><label>Lateralidad</label><select name="side"><option>No aplica</option><option>Derecha</option><option>Izquierda</option><option>Bilateral</option></select></div>
  <div class="field"><label>Institución</label><input name="inst"></div>
  <div class="field"><label>Fecha</label><input type="date" name="date"></div>
  <div class="field"><label>Urgencia</label><select name="urg"><option>Electiva</option><option>Preferente</option><option>Urgente</option><option>Emergencia</option></select></div>
  <div class="field"><label>Módulo</label><input name="module"></div>
  <div class="field"><label>Unidades</label><input type="number" name="units"></div>
  <div class="field"><label>Valor unidad</label><input type="number" name="uv"></div>
  <div class="field"><label>Honorarios</label><input type="number" name="fees"></div>
  <button class="pri span2">CREAR CIRUGÍA</button></form>`;
}
function cases(){return `<h2>Casos quirúrgicos</h2>${list(S())}`}
function finance(){
  const a=S(),tot=a.reduce((s,c)=>s+(+c.fees||0),0),cob=a.filter(c=>c.fin==="Cobrado").reduce((s,c)=>s+(+c.fees||0),0);
  return `<h2>Finanzas</h2><div class="grid metrics">${metric("Registrado",M(tot))}${metric("Cobrado",M(cob))}${metric("Pendiente",M(tot-cob))}</div>${list(a)}`;
}
function backupView(){
  const a=S(),needs=dirty(),lb=lastBackup(),hb=hasBackup();
  const statusTitle=!hb?"Primer backup pendiente":(needs?"Backup pendiente":"Backup al día");
  const statusBadge=!hb?"SIN BACKUP":(needs?"PENDIENTE":"OK");
  const statusClass=hb&&!needs?"ok":"warn";
  return `<h2>iCloud Backup</h2>
  <div class="card backup-status">
    <div><strong>${statusTitle}</strong><div class="muted">Último respaldo: ${E(fmtDateTime(lb))}<br>${a.length} caso(s) guardados en este iPhone.</div></div>
    <span class="badge ${statusClass}">${statusBadge}</span>
  </div>

  <div class="notice" style="margin-top:10px">NeuroCore genera un archivo de backup <b>cifrado</b> y lo descarga al iPhone. Después, desde <b>Archivos → Descargas</b>, movelo a <b>iCloud Drive → NeuroCore</b>. iOS no permite que una web escriba directamente y en silencio dentro de iCloud.</div>

  <div class="grid" style="margin-top:12px">
    <button id="icloudSave" class="pri bigbtn">Generar backup cifrado</button>
    <button id="restoreBtn" class="bigbtn">Restaurar desde iCloud</button>
    <button id="notesBtn" class="bigbtn">Compartir resumen a Notas</button>
    <button id="plainExport" class="bigbtn">Exportar JSON de emergencia</button>
  </div>

  <hr class="sep">
  <div class="muted">El backup cifrado usa AES‑GCM y una clave derivada de la contraseña que ingreses. Esa contraseña no se guarda. Si la olvidás, el backup no puede recuperarse.</div>`;
}
function casedetail(){
  const c=S().find(x=>x.id===CID); if(!c)return `<div class="card">Caso no encontrado.</div>`;
  const i=ST.indexOf(c.status),po=P[c.proc]?.po||[],ts=tasks(c);
  return `<button data-go="cases">← Casos</button><h2>${E(c.name)}</h2>
  <div class="card">
    <div class="row"><div><b>${E(c.proc)} ${E(c.level||"")}</b><div class="muted">${E(c.dx)}</div></div><span class="badge">${E(c.status)}</span></div>
    <div class="timeline">${ST.map((s,j)=>`<span class="step ${j<i?"done":j===i?"on":""}">${E(s)}</span>`).join("")}</div>
    <div class="field"><label>Estado</label><select id="st">${ST.map(s=>`<option ${s===c.status?"selected":""}>${s}</option>`).join("")}</select></div>
    <button id="savest" class="ok">Guardar estado</button>
  </div>
  <h2>Documentos</h2>
  <div class="docs">
    ${[["hc","Resumen de historia clínica"],["ind","Indicación quirúrgica"],["auth","Solicitud de autorización"],["pre","Checklist prequirúrgico"],["foja","Foja quirúrgica base"],["d0","Evolución D0"],["d1","Evolución D1"],["alta","Epicrisis / alta"],["hon","Honorarios"]].map(d=>`<button data-doc="${d[0]}">${d[1]}</button>`).join("")}
    <button id="notesCase">Compartir resumen del caso a Notas</button>
  </div>
  <h2>Checklist</h2>
  <div class="card checks">${ts.map(t=>`<label class="check"><input type="checkbox" data-task="${c.id}|${t.k}" ${c.done?.[t.k]?"checked":""}><span>${E(t.t)}</span></label>`).join("")||"Sin tareas activas."}</div>
  <h2>Postoperatorio específico</h2><div class="card"><ul>${po.map(x=>`<li>${E(x)}</li>`).join("")}</ul></div>
  <h2>Finanzas</h2>
  <div class="card form">
    <div class="field"><label>Estado</label><select id="fin">${FS.map(s=>`<option ${s===c.fin?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="field"><label>Honorarios</label><input id="fee" type="number" value="${E(c.fees||"")}"></div>
    <button id="savefin">Guardar finanzas</button>
  </div>`;
}

function doc(c,k){
  const sec=(t,b)=>`<h2>${t}</h2>${b}`,base=`<small>NeuroCore+ · ${E(c.ep)}</small><h1>${E(c.name)}</h1><p><b>DNI:</b> ${E(c.dni||"—")} · <b>Cobertura:</b> ${E(c.ins||"—")} · <b>Afiliado:</b> ${E(c.aff||"—")}</p><p><b>Diagnóstico:</b> ${E(c.dx)}</p><p><b>Procedimiento:</b> ${E(c.proc)} ${E(c.level||"")} ${E(c.side||"")}</p>`;
  if(k==="hc")return base+sec("Resumen clínico",`<p>${E(c.summary||"Sin resumen cargado.")}</p>`)+sec("Conducta",`<p>Se indica ${E(c.proc)} ${E(c.level||"")} ${E(c.side||"")}.</p>`);
  if(k==="ind")return base+sec("Indicación quirúrgica",`<p>Se indica ${E(c.proc)} por ${E(c.dx)}. Prioridad: ${E(c.urg)}.</p>`);
  if(k==="auth")return base+sec("Solicitud",`<p>Se solicita autorización para ${E(c.proc)} ${E(c.level||"")}.</p><p>Módulo: ${E(c.module||"—")} · Unidades: ${E(c.units||"—")}</p>`);
  if(k==="pre")return base+sec("Checklist prequirúrgico",`<ul>${(P[c.proc]?.q||[]).map(x=>`<li>☐ ${E(x)}</li>`).join("")}</ul>`);
  if(k==="foja")return base+sec("Foja quirúrgica base",`<p>Institución: ${E(c.inst||"—")} · Fecha: ${D(c.date)}</p><p>Completar con técnica efectivamente realizada, hallazgos, implantes, hemostasia, cierre, complicaciones y destino postoperatorio.</p>`);
  if(k==="d0"||k==="d1")return base+sec(`Evolución ${k.toUpperCase()}`,`<p>Estado clínico: _______________________________________</p><p>Neurológico: __________________________________________</p><ul>${(P[c.proc]?.po||[]).map(x=>`<li>☐ ${E(x)}</li>`).join("")}</ul><p>Conducta: _____________________________________________</p>`);
  if(k==="alta")return base+sec("Epicrisis / alta",`<p>Resumen de internación: __________________________________________</p><p>Medicación: __________________________</p><p>Cuidados / actividad: __________________</p><p>Signos de alarma: _____________________</p><p>Control: ______________________________</p>`);
  return base+sec("Honorarios",`<p>Módulo: ${E(c.module||"—")} · Unidades: ${E(c.units||"—")} · Valor unidad: ${M(c.uv)} · Honorarios: ${M(c.fees)} · Estado: ${E(c.fin)}</p>`);
}
function showdoc(k){
  const c=S().find(x=>x.id===CID);
  modal.className="modal";
  modal.innerHTML=`<div class="bar"><button id="close">Cerrar</button><button id="print" class="pri">Imprimir / PDF</button></div><div class="paper">${doc(c,k)}</div>`;
  document.getElementById("close").onclick=()=>{modal.className="hidden";modal.innerHTML=""};
  document.getElementById("print").onclick=()=>window.print();
}

function caseText(c){
  return `NEUROCORE+\nPaciente: ${c.name}\nDNI: ${c.dni||"—"}\nCobertura: ${c.ins||"—"}\nAfiliado: ${c.aff||"—"}\nDiagnóstico: ${c.dx}\nProcedimiento: ${c.proc} ${c.level||""} ${c.side||""}\nInstitución: ${c.inst||"—"}\nFecha: ${D(c.date)}\nEstado: ${c.status}\nResumen: ${c.summary||"—"}\nHonorarios: ${M(c.fees)}\nEstado financiero: ${c.fin}`;
}
function allCasesText(){
  const a=S();
  return `NEUROCORE+ · Resumen de casos\nGenerado: ${new Date().toLocaleString("es-AR")}\n\n`+a.map(caseText).join("\n\n--------------------\n\n");
}
async function shareText(title,text){
  if(navigator.share){
    try{await navigator.share({title,text});return true}catch(e){if(e.name==="AbortError")return false}
  }
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  downloadBlob(blob,title.replace(/[^\w\-]+/g,"_")+".txt");
  return true;
}
function downloadBlob(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function bytesToB64(bytes){
  let s=""; for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
  return btoa(s);
}
function b64ToBytes(s){
  const raw=atob(s),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out;
}
async function deriveKey(pass,salt){
  const enc=new TextEncoder();
  const material=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
function backupPayload(){
  return {format:"NeuroCoreBackup",version:2,createdAt:new Date().toISOString(),cases:S()};
}
async function encryptedBackupFile(pass){
  const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(pass,salt);
  const plain=enc.encode(JSON.stringify(backupPayload()));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain));
  const wrapper={format:"NeuroCoreEncryptedBackup",version:1,kdf:"PBKDF2-SHA256-250000",cipher:"AES-GCM-256",salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(ct)};
  return new File([JSON.stringify(wrapper)],`NeuroCore_Backup_${new Date().toISOString().slice(0,10)}.ncbk`,{type:"application/json"});
}
async function saveICloud(){
  if(!window.crypto?.subtle){alert("Este navegador no permite cifrado seguro. Abrí NeuroCore desde Safari/HTTPS.");return}
  const pass=prompt("Contraseña para cifrar este backup:");
  if(!pass||pass.length<6){if(pass!==null)alert("Usá una contraseña de al menos 6 caracteres.");return}
  const btn=document.getElementById("icloudSave");
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Cifrando…'}
  try{
    const file=await encryptedBackupFile(pass);
    // Descarga directa: evita la restricción de iOS que bloquea navigator.share
    // cuando el cifrado asíncrono consume la activación del usuario.
    downloadBlob(file,file.name);
    setBackedUp();
    alert("Backup cifrado generado correctamente. Quedó en Descargas. Desde la app Archivos podés moverlo a iCloud Drive → NeuroCore.");
  }catch(e){
    alert("No se pudo generar el backup: "+e.message);
  }finally{render()}
}
function emergencyExport(){
  const blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:"application/json"});
  downloadBlob(blob,`NeuroCore_Emergencia_${new Date().toISOString().slice(0,10)}.json`);
}
async function restoreFromFile(file){
  try{
    const text=await file.text(),obj=JSON.parse(text);
    let payload=obj;
    if(obj.format==="NeuroCoreEncryptedBackup"){
      if(!window.crypto?.subtle)throw new Error("Cifrado no disponible");
      const pass=prompt("Contraseña del backup:");
      if(!pass)return;
      const key=await deriveKey(pass,b64ToBytes(obj.salt));
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(obj.iv)},key,b64ToBytes(obj.data));
      payload=JSON.parse(new TextDecoder().decode(plain));
    }
    if(payload.format!=="NeuroCoreBackup"||!Array.isArray(payload.cases))throw new Error("Archivo de backup no válido");
    const replace=confirm(`Se encontraron ${payload.cases.length} casos. Aceptar = reemplazar los datos actuales. Cancelar = no importar.`);
    if(!replace)return;
    localStorage.setItem("nc_cases",JSON.stringify(payload.cases));
    setBackedUp();alert("Backup restaurado correctamente.");nav("home");
  }catch(e){alert("No se pudo restaurar el backup. Verificá archivo y contraseña.\n\n"+e.message)}
}

function render(){
  view.innerHTML=V==="home"?home():V==="new"?form():V==="cases"?cases():V==="backup"?backupView():V==="finance"?finance():casedetail();
  bind();
}
function bind(){
  view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>nav(b.dataset.go));
  view.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>nav("case",b.dataset.open));
  view.querySelectorAll("[data-task]").forEach(x=>x.onchange=()=>{
    let[id,k]=x.dataset.task.split("|"),a=S(),c=a.find(z=>z.id===id);c.done=c.done||{};c.done[k]=x.checked;W(a);render()
  });
  view.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>showdoc(b.dataset.doc));
  if(V==="new"){
    const f=document.getElementById("f"),proc=document.getElementById("proc"),region=document.getElementById("region");
    proc.onchange=()=>region.value=P[proc.value]?.r||"";
    f.onsubmit=e=>{
      e.preventDefault();
      const o=Object.fromEntries(new FormData(f).entries());
      if(!o.fees&&o.units&&o.uv)o.fees=+o.units*+o.uv;
      const c={...o,id:ID("C"),ep:ID("E"),status:"Indicada",fin:"Sin presentar",done:{},created:new Date().toISOString()};
      const a=S();a.unshift(c);W(a);nav("case",c.id)
    };
  }
  if(V==="case"){
    const a=S(),c=a.find(x=>x.id===CID);
    document.getElementById("savest").onclick=()=>{c.status=document.getElementById("st").value;W(a);render()};
    document.getElementById("savefin").onclick=()=>{c.fin=document.getElementById("fin").value;c.fees=document.getElementById("fee").value;W(a);render()};
    document.getElementById("notesCase").onclick=()=>shareText(`NeuroCore_${c.name}`,caseText(c));
  }
  if(V==="backup"){
    document.getElementById("icloudSave").onclick=saveICloud;
    document.getElementById("restoreBtn").onclick=()=>restoreFile.click();
    document.getElementById("notesBtn").onclick=()=>shareText("NeuroCore - Resumen",allCasesText());
    document.getElementById("plainExport").onclick=emergencyExport;
  }
}

document.getElementById("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>nav(b.dataset.v));
document.getElementById("plus").onclick=()=>nav("new");
restoreFile.onchange=()=>{const f=restoreFile.files[0];if(f)restoreFromFile(f);restoreFile.value=""};
render();
</script>
